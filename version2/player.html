<!DOCTYPE html>
<html>
<head>
  <title>Screen Recording Player</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #1a1a1a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .video-container {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    video {
      width: 100%;
      display: block;
      background: #000;
    }
    .info {
      margin-top: 15px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
    }
    .info p {
      margin: 5px 0;
      font-size: 14px;
    }
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px 30px;
      border-radius: 4px;
    }
    .error {
      color: #ff4444;
      text-align: center;
      padding: 20px;
      background: rgba(255, 0, 0, 0.1);
      border-radius: 8px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Screen Recording</h1>
    </div>
    <div class="video-container">
      <div id="loading" class="loading">Loading video...</div>
      <video id="videoPlayer" controls style="display: none;">
        Your browser does not support the video tag.
      </video>
    </div>
    <div id="error" class="error" style="display: none;"></div>
    <div class="info" id="videoInfo">
      <!-- Video info will be inserted here -->
    </div>
  </div>
  <script src="player.js"></script>
</body>
</html>
